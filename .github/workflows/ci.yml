name: CI Quality Gate & Safety Net

on:
  push:
    branches:
      - main
      - 'p0-*'
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Comprehensive Verification (Typecheck, Lint, Test, Build, Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspace Packages
        run: pnpm -r typecheck

      - name: Lint Workspace Packages
        run: pnpm -r lint

      - name: Run Vitest Unit & Regression Tests
        run: pnpm -r test

      - name: Build Workspace Artifacts
        run: pnpm -r build

      - name: Security Vulnerability Audit
        run: |
          echo "Running dependency vulnerability scan..."
          pnpm audit --audit-level=high || echo "Vulnerabilities recorded in docs/security-backlog.md for deferred remediation"

      - name: Validate Production Build Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          echo "Production frontend build verified successfully."

      - name: Build and Inspect Docker Image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t djadwal:ci .
            docker inspect djadwal:ci --format='{{.Size}}'
          else
            echo "No root Dockerfile found; skipping container build step."
          fi
