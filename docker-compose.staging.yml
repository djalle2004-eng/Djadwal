version: '3.8'

services:
  # Staging API & Frontend Web App (matches production node & express 5 environment)
  djadwal-staging-app:
    build:
      context: .
      dockerfile: Dockerfile.staging
    image: djadwal:staging
    container_name: djadwal_staging_app
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      - NODE_ENV=staging
      - PORT=5000
      - TURSO_DATABASE_URL=http://sqld-staging:8080
      - TURSO_AUTH_TOKEN=staging-dummy-token-not-production
      - SESSION_SECRET=staging_insecure_development_secret_only
      - CORS_ORIGIN=http://localhost:5050
    depends_on:
      sqld-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/status', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - staging_app_data:/app/data

  # Staging LibSQL database (matches production Turso cloud engine locally)
  sqld-staging:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: djadwal_staging_libsql
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SQLD_NODE=standalone
      - SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - staging_db_data:/var/lib/sqld

volumes:
  staging_app_data:
  staging_db_data:
